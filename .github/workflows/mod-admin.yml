name: CI

on:
  push:
    branches: [main, develop, 'setup-ci/cd']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Detectar pruebas disponibles
        id: tools
        run: |
          echo "vitest=$(grep -q '"vitest"' package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "playwright=$(ls playwright.config.* >/dev/null 2>&1 && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # --- Calidad estática ---
      - name: ESLint
        run: npx eslint .

      - name: Prettier
        run: npx prettier --check .

      - name: TypeScript
        run: npx tsc -b

      # --- Unitarias / componentes / integración ---
      - name: Vitest
        if: steps.tools.outputs.vitest == 'true'
        run: npx vitest run --passWithNoTests

      # --- Build ---
      - name: Build
        run: npm run build

      # --- E2E (solo Chromium, flujos críticos) ---
      - name: Instalar Chromium
        if: steps.tools.outputs.playwright == 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        if: steps.tools.outputs.playwright == 'true'
        run: npx playwright test --project=chromium --pass-with-no-tests

      - uses: actions/upload-artifact@v4
        if: failure() && steps.tools.outputs.playwright == 'true'
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
